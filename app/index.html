<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Dedicated small icons rather than pointing the tab at the 1.4MB
         penguin-icon.png the splash screen uses - that made every visitor
         download the full-size artwork to draw a 16px favicon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" id="manifest-link" />
    <!-- iOS only: remove the manifest so Add-to-Home-Screen installs from the
         apple-* meta tags below instead. Root cause of the dead strip under
         the tab bar on newer installs: when iOS installs from a manifest with
         display:standalone it IGNORES apple-mobile-web-app-status-bar-style
         black-translucent and runs the webview INSET (short of the physical
         screen by a status bar's height - measured 879 vs 926 on the affected
         iPhone; nothing inside the webview can paint that strip). Installing
         from the meta tags honours black-translucent and gives the true
         full-screen webview (how the older, healthy installs behave).
         navigator.standalone exists only on iOS, so Android keeps the
         manifest its install path needs. Runs inline before parsing finishes
         so the share sheet never sees the link on iOS. -->
    <script>
      if (typeof navigator.standalone !== 'undefined') document.getElementById('manifest-link').remove()
    </script>
    <!-- Static first-paint theme-color pair, read BEFORE main.js has run (so
         there's no flash of the wrong colour on first load) - hexes are
         style.css's --page-bg for each theme (light: :root[data-theme="light"],
         dark: :root[data-theme="dark"] / the default :root). main.js's
         syncThemeColorMeta() adds a third, unconditional (no `media` attr)
         theme-color meta once it runs, appended after these two - being last
         in the DOM makes it the one that actually wins from then on, and it's
         what stays in sync with the chef's in-app light/dark TOGGLE (which is
         independent of the OS-level scheme these two only cover pre-JS). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4ECE0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#120c09" />
    <!-- `default` renders an opaque WHITE bar on iOS standalone (the webview
         starts BELOW it; no meta/manifest colour ever reaches that bar) -
         black-translucent is the only mode where the webview goes fullscreen
         and the app's own background paints under the clock. viewport-fit=
         cover and .statusbar's safe-area padding are already in place to
         handle the fullscreen webview; body::before (style.css) covers the
         status text's own legibility now that theme-color can't reach it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real
         values on iOS; without it they resolve to 0, which is why the header
         padded with a hardcoded guess and the tab bar's bottom inset never
         actually applied. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chef Penguino</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
