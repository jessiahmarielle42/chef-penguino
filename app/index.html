<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Dedicated small icons rather than pointing the tab at the 1.4MB
         penguin-icon.png the splash screen uses - that made every visitor
         download the full-size artwork to draw a 16px favicon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Dark-theme page background, since dark is the default. applyTheme()
         rewrites this on load and on every theme toggle - see PAGE_BG in main.js,
         which must stay in step with --page-bg in style.css. -->
    <meta name="theme-color" content="#120c09" />
    <!-- Without this the installed app renders iOS's `default` status bar: a
         white strip with dark text, regardless of the app's own theme. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real
         values on iOS; without it they resolve to 0, which is why the header
         padded with a hardcoded guess and the tab bar's bottom inset never
         actually applied. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Chef Penguino</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
